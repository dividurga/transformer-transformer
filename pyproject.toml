[project]
name = "t2"
version = "1.0.0"
authors = [{ name = "Huy Ha", email = "huyha@stanford.edu" }]
description = "Transformer Transformer: A Unified Model for Motion-Conditioned Robot Co-design"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  # Core ML/DL
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "transformers>=4.56.1",
  "diffusers>=0.35.1",
  "accelerate>=1.10.1",
  "tokenizers>=0.22.0",
  "safetensors>=0.6.2",

  # JAX ecosystem
  "jax[cuda13]>=0.8.0; sys_platform == 'linux'",
  "jax>=0.8.0; sys_platform != 'linux'",
  "jaxlib>=0.8.0",
  "flax>=0.12.0",
  "optax>=0.2.5",
  "chex>=0.1.90",
  "jaxopt>=0.8.5",
  "orbax-checkpoint>=0.11.23",

  # Robotics/Simulation
  "mujoco>=3.5.0",
  "mujoco-mjx>=3.5.0",
  "dm-control>=1.0.34",
  "dm-env>=1.6",
  "dm-tree>=0.1.9",
  "brax>=0.13.0",
  "gym>=0.26.2",
  "mink>=0.0.13",
  "evosax>=0.2.0",
  "interpax>=0.3.12",
  "warp-lang>=1.11.1",

  # Data/Numerics
  "numpy>=2.2.5",
  "scipy>=1.16.1",
  "pandas>=2.3.2",
  "zarr>=3.1.1",
  "numcodecs>=0.16.2",
  "tensorstore>=0.1.76",

  # Visualization
  "matplotlib>=3.10.5",
  "seaborn>=0.13.2",
  "imageio>=2.37.0",
  "imageio-ffmpeg>=0.6.0",
  "trimesh>=4.7.4",
  "pillow>=11.2.1",

  # Configuration/Utilities
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "pyyaml>=6.0.2",
  "click>=8.2.1",
  "tqdm>=4.67.1",
  "rich>=14.0.0",

  # Experiment Tracking
  "wandb>=0.19.11",
  "tensorboardx>=2.6.4",

  # Distributed Computing
  "ray>=2.46.0",

  # Optimization
  "cma>=4.4.1",
  "qpsolvers>=4.8.2",
  "daqp>=0.7.2",

  # Utilities
  "gitpython>=3.1.0",
  "transforms3d>=0.4.2",
  "pyopengl>=3.1.10",
  "glfw>=2.9.0",
  "treescope>=0.1.10",
  "ml-collections>=1.1.0",
  "ml-dtypes>=0.5.3",
  "etils>=1.13.0",
  "toolz>=1.0.0",
  "humanize>=4.12.3",
  "protobuf>=6.32.0",
  "requests>=2.32.5",
  "fsspec>=2025.7.0",
  "cloudpickle>=3.1.1",
  "psutil>=7.0.0",
  "pydantic>=2.11.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-xdist>=3.6.1",
  "black>=25.1.0",
  "isort>=6.0.1",
  "ruff>=0.14.10",
  "line-profiler>=5.0.0",
  "mypy-extensions>=1.1.0",
]

[project.urls]
"Homepage" = "https://transformer-transformer.github.io"
"Repository" = "https://github.com/real-stanford/transformer-transformer"
"Bug Tracker" = "https://github.com/real-stanford/transformer-transformer/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["t2*"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
triton = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[tool.basedpyright]
typeCheckingMode = "basic"
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
include = ["t2", "scripts", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
ignore = []

reportMissingImports = true
reportMissingTypeStubs = false

pythonVersion = "3.12"
pythonPlatform = "Linux"
