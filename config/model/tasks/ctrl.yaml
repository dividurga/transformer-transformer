# from hardware, past state and ctrl goal, predict target ctrl
defaults:
  # input trajectory
  - adapter@adapters.ctrl_goal: pose
  # input hardware
  - adapter@adapters.link: link
  - adapter@adapters.dyna_joint: dyna_joint
  - adapter@adapters.fixed_joint: fixed_joint
  - adapter@adapters.actuator: actuator
  # output state
  - adapter@adapters.track_link_obs: pose_diffuse
  - adapter@adapters.free_link_obs: pose_diffuse
  - adapter@adapters.dyna_joint_obs: qpos_diffuse
  - adapter@adapters.actuator_obs: actuator_obs_diffuse
  # output control
  - adapter@adapters.ctrl: pos_ctrl_diffuse
  # adapter params
  - diffusion_task
  - _self_
adapters:
  # no loss for inputs
  ctrl_goal:
    loss_weight: 0.0
    modality:
      id_attrs:
        - time/id
        - track_link/id
      name: target_pose
      max_seq_len: ${eval:"${ctrl_seq_len.target_pose}*${ctrl_seq_len.rollout_steps}"}
  link:
    loss_weight: 0.0
    modality:
      id_attrs:
        - id
        - track_link/id
        - free_link/id
  dyna_joint:
    loss_weight: 0.0
    modality:
      id_attrs:
        - id
        - link/id
  fixed_joint:
    loss_weight: 0.0
    modality:
      id_attrs:
        - id
        - link/id
  actuator:
    loss_weight: 0.0
    modality:
      id_attrs:
        - id
        - dyna_joint/id
  # loss weight > 0 for outputs
  track_link_obs:
    loss_weight: 1.0
    dont_noise_timesteps: [0]
    modality:
      id_attrs:
        - time/id
        - track_link/id
      name: track_link_obs
      max_seq_len: ${eval:"${ctrl_seq_len.track_link_obs}*${ctrl_seq_len.rollout_steps}"}
  free_link_obs:
    loss_weight: 1.0
    dont_noise_timesteps: [0]
    modality:
      id_attrs:
        - time/id
        - free_link/id
      name: free_link_obs
      max_seq_len: ${eval:"${ctrl_seq_len.free_link_obs}*${ctrl_seq_len.rollout_steps}"}
  dyna_joint_obs:
    loss_weight: 1.0
    dont_noise_timesteps: [0]
    modality:
      attrs:
        qpos: 1
        qvel: 1
      id_attrs:
        - time/id
        - dyna_joint/id
      name: dyna_joint_obs
      max_seq_len: ${eval:"${ctrl_seq_len.dyna_joint_obs}*${ctrl_seq_len.rollout_steps}"}
  actuator_obs:
    loss_weight: 1.0
    dont_noise_timesteps: null
    modality:
      id_attrs:
        - time/id
        - actuator/id
      name: actuator_obs
      max_seq_len: ${eval:"${ctrl_seq_len.actuator_obs}*${ctrl_seq_len.rollout_steps}"}
  ctrl:
    loss_weight: 1.0
    # never give the model any ground truth control values
    dont_noise_timesteps: [-1] # treat this as prev action
    modality:
      id_attrs:
        - actuator/id
        - time/id
      max_seq_len: ${eval:"${ctrl_seq_len.actuator}*${ctrl_seq_len.rollout_steps}"}
