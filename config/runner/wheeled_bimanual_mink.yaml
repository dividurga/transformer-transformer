# The runner for the `wheeled_bimanual` design space (moving base + two arms).
defaults:
  - base

_target_: t2.env.wheeled_bimanual_mink_runner.WheeledBimanualMinkEnvRunner
look_ahead_steps: 4
mink_solver: 'daqp'
mink_max_iters: 20
mink_reset_max_iters: 50
mink_pos_threshold: 1e-4
mink_ori_threshold: 1e-4

mink_pos_cost: 1.0
mink_ori_cost: 1.0
mink_lm_damping: 1.0
mink_damping_cost: 1e-3
mink_posture_cost: 1e-3

qpos_noise: 0.0

randomize_default_posture: false

infer_controller_weights: true

reset_base_posture_cost_multiplier: 10
reset_body_posture_cost_multiplier: 10
