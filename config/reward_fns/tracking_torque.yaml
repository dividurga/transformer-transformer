regularized_tracking_error:
  _target_: t2.eval.diffusion_guidance.RegularizedExpTrackingError
  pose_weight: 1.0
  pos_sigma: 0.01
  orn_sigma: 0.5
  power: 2
  # Used unchanged on both the ViperX and quadruped torque panels — unlike the
  # velocity reward, this one transferred across design spaces, so there is no
  # tracking_torque_quadruped variant. Raise to 0.0005 to really push it.
  torque_weight: 0.00005
  velocity_weight: 0.0
  leaky_clip_slope: 0.0
